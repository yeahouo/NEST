spring.application.name=demo2

# 开启 404 异常抛出
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true

# 数据库连接 (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/codeclass?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=your_username
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis 配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.umi.nest.entity
mybatis.configuration.map-underscore-to-camel-case=true

# 文件上传配置 (请修改为你的实际路径)
app.upload.dir=./uploads/avatars
app.upload.materials.dir=./uploads/materials

# 文件上传大小限制
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
spring.servlet.multipart.file-size-threshold=0

# Tomcat 内置限制
server.tomcat.max-http-form-post-size=500MB
server.tomcat.max-swallow-size=500MB

# 服务器超时配置
server.servlet.session.timeout=30m

# 教师邀请码
app.teacher.invitation-code=YOUR_INVITATION_CODE
