<!DOCTYPE html>
<html data-theme="nestlight" lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
  <title>学工平台 · 宿舍分配工作台</title>
  <link href="/manifest.webmanifest" rel="manifest"/>
  <meta content="#3e63dd" name="theme-color"/>
  <link href="/icons/icon-192.png" rel="icon" sizes="192x192" type="image/png"/>
  <link href="/icons/apple-touch-icon.png" rel="apple-touch-icon"/>
  <meta content="yes" name="apple-mobile-web-app-capable"/>
  <meta content="default" name="apple-mobile-web-app-status-bar-style"/>
  <meta content="学工平台" name="apple-mobile-web-app-title"/>
  <script defer src="/pwa.js"></script>
  <!--
    主题必须在样式表之前定下来。放到 defer 的共享脚本里会先按浅色画一帧、
    再翻成深色 —— 也就是俗称的「闪白」，比没有深色模式更难受。
    所以这段必须内联，且必须排在 <link rel="stylesheet"> 前面。
  -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('nest-theme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) { document.documentElement.classList.add('dark'); }
        document.documentElement.setAttribute('data-theme', dark ? 'nestdark' : 'nestlight');
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (err) { /* 隐私模式下 localStorage 会抛异常，跟随系统即可 */ }
    })();
  </script>
  <link rel="stylesheet" href="/libs/radix-colors/colors.css">
  <link href="/libs/open-props/open-props.min.css" rel="stylesheet"/>
  <link href="/css/nest-fonts.css" rel="stylesheet"/>
  <link href="/css/nest.css" rel="stylesheet"/>
<link rel="stylesheet" href="/css/nest-art3.css">
  <style>
    /* .tab-active 的外观已并入 nest.css 的 .nx-tab.tab-active（第十二轮统一），这里不再重复定义 */
    .mono { font-variant-numeric: tabular-nums; }
    table.grid-table { width: 100%; border-collapse: collapse; font-size: .875rem; }
    table.grid-table th { text-align: left; font-weight: 600; color: var(--nx-muted); padding: .5rem .75rem; border-bottom: 1px solid var(--nx-sep); white-space: nowrap; }
    table.grid-table td { padding: .5rem .75rem; border-bottom: 1px solid var(--nx-sep); }
  </style>
</head>
<body data-nx-particles="soft" class="font-display nx-page min-h-screen bg-base-100 text-base-content selection:bg-primary/30">
<div class="relative z-10 flex min-h-screen flex-col">
  <header class="nx-topbar navbar nx-glass nx-hairline-b sticky top-0 z-50 min-h-0 gap-2 justify-between rounded-none px-6 py-2 md:px-20">
    <div class="navbar-start w-auto min-w-0 flex-1 items-center gap-3">
      <div class="text-primary"><span class="material-symbols-outlined text-3xl">apartment</span></div>
      <div>
        <h2 class="nx-brand text-xl leading-tight">学工平台 <span class="text-primary">宿舍分配</span></h2>
        <p class="text-xs nx-muted">宿舍智能分配与可解释决策支持 · 管理端</p>
      </div>
    </div>
    <div class="navbar-end w-auto flex-none items-center gap-1 md:gap-2">
      <button onclick="location.href='dorm-psyche.html'" class="flex items-center gap-2 px-4 py-2 rounded-full hover:bg-primary/10 transition-colors">
        <span class="material-symbols-outlined text-xl">psychology</span><span class="text-sm font-medium hidden md:inline">心理特征</span>
      </button>
      <button onclick="location.href='dorm-portal.html'" class="flex items-center gap-2 px-4 py-2 rounded-full hover:bg-primary/10 transition-colors">
        <span class="material-symbols-outlined text-xl">person</span><span class="text-sm font-medium hidden md:inline">学生门户</span>
      </button>
      <button onclick="location.href='admin-dashboard.html'" class="flex items-center gap-2 px-4 py-2 rounded-full hover:bg-primary/10 transition-colors">
        <span class="material-symbols-outlined text-xl">arrow_back</span><span class="text-sm font-medium hidden md:inline">返回后台</span>
      </button>
    </div>
  </header>

  <main class="flex-1 px-6 pb-16 pt-10 md:px-20">
    <div class="mx-auto max-w-7xl nx-rise">
      <header class="mb-8 border-b border-base-300 pb-6">
        <p class="nx-kicker">Residence / Admin console</p>
        <h1 class="mt-2 font-serif text-3xl leading-tight sm:text-4xl">宿舍分配工作台</h1>
        <p class="mt-3 max-w-3xl text-sm leading-relaxed nx-muted">导入数据 → 一键分配 → 查看解释与审计 → 处理申诉。所有相容度指标都算在<strong class="text-base-content">算法看不到的隐真值</strong>上。</p>
      </header>

      <div class="mb-8 grid grid-cols-2 gap-px overflow-hidden rounded-box border border-base-300 bg-base-300 md:grid-cols-4" id="stats"></div>

      <nav class="mb-8 flex flex-wrap gap-1.5 rounded-box border border-base-300 bg-base-200 p-1.5">
        <button data-tab="data" class="tab-btn tab-active nx-tab"><span class="material-symbols-outlined align-middle text-base">database</span> 数据准备</button>
        <button data-tab="assign" class="tab-btn nx-tab"><span class="material-symbols-outlined align-middle text-base">play_circle</span> 一键分配</button>
        <button data-tab="rooms" class="tab-btn nx-tab"><span class="material-symbols-outlined align-middle text-base">meeting_room</span> 房间视图</button>
        <button data-tab="why" class="tab-btn nx-tab"><span class="material-symbols-outlined align-middle text-base">help</span> 四维解释</button>
        <button data-tab="appeal" class="tab-btn nx-tab"><span class="material-symbols-outlined align-middle text-base">gavel</span> 申诉处理</button>
        <button data-tab="audit" class="tab-btn nx-tab"><span class="material-symbols-outlined align-middle text-base">balance</span> 公平性审计</button>
        <button data-tab="collect" class="tab-btn nx-tab"><span class="material-symbols-outlined align-middle text-base">fact_check</span> 补采建议</button>
        <button data-tab="raw" class="tab-btn nx-tab"><span class="material-symbols-outlined align-middle text-base">data_object</span> 原始响应</button>
      </nav>

      <div id="panel-data" class="panel"></div>
      <div id="panel-assign" class="panel hidden"></div>
      <div id="panel-rooms" class="panel hidden"></div>
      <div id="panel-why" class="panel hidden"></div>
      <div id="panel-appeal" class="panel hidden"></div>
      <div id="panel-audit" class="panel hidden"></div>
      <div id="panel-collect" class="panel hidden"></div>
      <div id="panel-raw" class="panel hidden"><pre id="raw-out" class="max-h-[70vh] overflow-auto rounded-box border border-base-300 bg-base-300 p-4 font-mono text-xs"></pre></div>
    </div>
  </main>
</div>

<script>
const $ = (id) => document.getElementById(id);
let BATCHES = [], CURRENT = null, SUMMARY = null, GROUND_TRUTH = false;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function num(x,d=2){return x==null||Number.isNaN(Number(x))?'—':Number(x).toFixed(d);}
function pct(x){return x==null?'—':(Number(x)*100).toFixed(1)+'%';}
function toast(msg, bad){ const d=document.createElement('div');
  d.className='fixed bottom-6 right-6 z-[100] rounded-box px-5 py-3 text-sm font-medium shadow-lg '+(bad?'bg-error text-error-content':'bg-neutral text-neutral-content');
  d.textContent=msg; document.body.appendChild(d); setTimeout(()=>d.remove(), bad?6000:3000); }
function raw(o){ $('raw-out').textContent = JSON.stringify(o,null,2); }

async function api(url, opts) {
  const res = await fetch(url, Object.assign({headers:{'Content-Type':'application/json'}}, opts||{}));
  let j; try { j = await res.json(); } catch(e){ throw new Error('HTTP '+res.status+' 返回了非 JSON 内容'); }
  if (j.code !== 200) throw new Error(j.message || ('HTTP '+res.status));
  return j.data;
}
const post = (u,b) => api(u,{method:'POST', body: JSON.stringify(b||{})});
async function guard(fn){ try { await fn(); } catch(e){ toast(e.message, true); console.error(e); } }

// ── 统一对话框的页内兜底（nest-ui.js 是 defer 加载的，所以调用时才看 window.NestUI） ──
function nxAlert(message, options) {
  if (window.NestUI && NestUI.dialog) return NestUI.dialog.alert(message, options);
  window.alert(message);
  return Promise.resolve();
}
function nxConfirm(message, options) {
  if (window.NestUI && NestUI.dialog) return NestUI.dialog.confirm(message, options);
  return Promise.resolve(window.confirm(message));
}

function card(title, icon, body, extra) {
  return `<div class="p-6 mb-6 ${extra||''} nx-panel">
    <div class="flex items-center gap-2 mb-4"><span class="material-symbols-outlined text-primary">${icon}</span>
    <h3 class="font-bold text-lg">${esc(title)}</h3></div>${body}</div>`;
}
function statCard(label, value, sub, icon) {
  return `<div class="flex flex-col gap-1 bg-base-100 p-6">
    <div class="flex items-center gap-3 mb-1"><span class="material-symbols-outlined text-primary text-xl">${icon}</span>
    <span class="text-xs nx-muted">${esc(label)}</span></div>
    <div class="text-2xl font-black mono">${value}</div>
    <div class="text-xs mt-1 nx-muted">${esc(sub||'')}</div></div>`;
}

// ── 概览 ────────────────────────────────────────────────
async function loadSummary() {
  SUMMARY = await api('/api/dorm/summary');
  GROUND_TRUTH = !!SUMMARY.hasGroundTruth;
  const newest = (BATCHES && BATCHES.length) ? '最近 #' + BATCHES[0].id : '还没有跑过';
  $('stats').innerHTML =
    statCard('学生', SUMMARY.students ?? 0, '床位共 ' + (SUMMARY.capacityTotal ?? 0) + ' 个', 'groups') +
    statCard('房间', SUMMARY.rooms ?? 0, '志愿 ' + (SUMMARY.preferences ?? 0) + ' 条 · 特征 ' + (SUMMARY.features ?? 0) + ' 条', 'meeting_room') +
    statCard('分配批次', SUMMARY.batches ?? 0, newest, 'inventory_2') +
    statCard('隐真值', GROUND_TRUTH ? '已就绪' : '无', GROUND_TRUTH ? '指标在真值上计算' : '指标将退回模型预测值', 'visibility');
  return SUMMARY;
}

// ── Tab ────────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => guard(async () => {
  document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('tab-active'));
  b.classList.add('tab-active');
  document.querySelectorAll('.panel').forEach(p => p.classList.add('hidden'));
  const t = b.dataset.tab; $('panel-'+t).classList.remove('hidden');
  if (t === 'data') renderData();
  if (t === 'assign') renderAssign();
  if (t === 'rooms') await renderRooms();
  if (t === 'why') renderWhy();
  if (t === 'appeal') await renderAppeal();
  if (t === 'audit') await renderAudit();
  if (t === 'collect') await renderCollect();
})));

// ── 数据准备 ────────────────────────────────────────────
function renderData() {
  $('panel-data').innerHTML =
  card('生成合成数据（带隐真值）', 'science', `
    <p class="text-sm nx-muted mb-4">
      生成器先抽真实特征 z，再定义一个<strong>算法永远看不到</strong>的真值相容度 g（含隐变量磁场项与「早起×晚睡」交互项），
      然后模拟「发问卷」只把带噪声的观测 o 交给求解器。最后用 g 评估。<br>
      真值单独存进 <code>dorm_ground_truth</code>，求解器不读这张表——这是物理隔离，不是口头承诺。</p>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
      <label class="block"><span class="text-xs nx-muted">学生数</span>
        <input id="g-n" type="number" value="1000" class="w-full rounded-md border-primary/20 bg-base-200 px-3 py-2"/></label>
      <label class="block"><span class="text-xs nx-muted">随机种子</span>
        <input id="g-seed" type="number" value="20260927" class="w-full rounded-md border-primary/20 bg-base-200 px-3 py-2"/></label>
      <label class="block"><span class="text-xs nx-muted">噪声强度</span>
        <input id="g-noise" type="number" step="0.05" value="0.2" class="w-full rounded-md border-primary/20 bg-base-200 px-3 py-2"/></label>
      <label class="block"><span class="text-xs nx-muted">缺失率</span>
        <input id="g-missing" type="number" step="0.05" value="0" class="w-full rounded-md border-primary/20 bg-base-200 px-3 py-2"/></label>
      <label class="block"><span class="text-xs nx-muted">志愿紧张度</span>
        <input id="g-tension" type="number" step="0.1" value="0.5" class="w-full rounded-md border-primary/20 bg-base-200 px-3 py-2"/></label>
      <label class="block"><span class="text-xs nx-muted">楼栋数</span>
        <input id="g-buildings" type="number" value="3" class="w-full rounded-md border-primary/20 bg-base-200 px-3 py-2"/></label>
      <label class="block"><span class="text-xs nx-muted">房间容量</span>
        <input id="g-cap" type="number" value="4" class="w-full rounded-md border-primary/20 bg-base-200 px-3 py-2"/></label>
      <label class="block"><span class="text-xs nx-muted">年级混合</span>
        <select id="g-grademix" class="w-full rounded-md border-primary/20 bg-base-200 px-3 py-2">
          <option value="true">是（同楼混年级）</option><option value="false">否</option></select></label>
    </div>
    <button onclick="genData()" class="nx-btn nx-btn-primary nx-btn-lg">生成并覆盖现有数据</button>
    <div id="gen-out" class="mt-4 text-sm"></div>`) +
  card('手工导入 JSON', 'upload_file', `
    <p class="text-sm nx-muted mb-3">
      students[].feature 是 11 维观测值，顺序：入睡时刻(小时,跨零点+24) / 起床时刻 / 吸烟 / 卫生 / 外向度 /
      在房间学习 / 噪声容忍度 / 社交活跃度 / 物品共享 / 游戏 / 学业拼搏。缺失请写 null，<strong>不要写 0</strong>（0 是「很外向」，null 才是「不知道」）。</p>
    <textarea id="imp-json" rows="10" class="w-full rounded-md border-primary/20 bg-base-200 px-4 py-3 text-xs font-mono"
      placeholder='{"replaceAll":true,"students":[{"studentNo":"2023001","name":"张三","gender":"M","grade":"2023","major":"软件工程","majorCluster":"信息类","specialNeed":"NONE","feature":[23.5,7,0,0.6,0.3,null,0.4,0.3,0.5,0.2,0.7],"wantRoommateWith":[]}],"rooms":[{"roomNo":"101","buildingId":"男生1号楼","gender":"M","capacity":4}]}'></textarea>
    <button onclick="importData()" class="mt-4 nx-btn nx-btn-primary nx-btn-lg">导入</button>
    <div id="imp-out" class="mt-4 text-sm"></div>`) +
  card('危险操作', 'warning', `
    <button onclick="clearData()" class="px-6 py-3 rounded-full bg-error text-white font-bold hover:bg-red-700">清空宿舍域全部数据</button>
    <p class="text-xs mt-2 nx-muted">只清 dorm_* 表，不影响学工域（用户/假条/公告）。问卷与聊天记录所在的 dorm_psyche_text / dorm_psyche_answer 也会被清空，请先确认。</p>`);
}
async function genData() {
  const body = {
    students: Number($('g-n').value), seed: Number($('g-seed').value),
    noise: Number($('g-noise').value), missing: Number($('g-missing').value),
    tension: Number($('g-tension').value), gradeMix: $('g-grademix').value === 'true',
    buildingCount: Number($('g-buildings').value), roomCapacity: Number($('g-cap').value)
  };
  $('gen-out').innerHTML = '<span class="text-primary">生成中…（万人规模约需数秒）</span>';
  await guard(async () => {
    const r = await post('/api/dorm/data/synthesize', body);
    raw(r);
    $('gen-out').innerHTML = '<pre class="text-xs bg-primary/5 p-3 rounded-md overflow-auto">' + esc(JSON.stringify(r,null,2)) + '</pre>';
    toast('已生成 ' + (r.students||0) + ' 名学生 / ' + (r.rooms||0) + ' 间房');
    await loadSummary();
  });
  $('gen-out').innerHTML = $('gen-out').innerHTML.replace('生成中…（万人规模约需数秒）','');
}
async function importData() {
  let obj; try { obj = JSON.parse($('imp-json').value); } catch(e){ toast('JSON 解析失败：'+e.message, true); return; }
  await guard(async () => {
    const r = await post('/api/dorm/data/import', obj);
    raw(r); $('imp-out').innerHTML = '<pre class="text-xs bg-primary/5 p-3 rounded-md overflow-auto">'+esc(JSON.stringify(r,null,2))+'</pre>';
    toast('导入完成'); await loadSummary();
  });
}
async function clearData() {
  if (!(await nxConfirm('确定清空宿舍域全部数据？此操作不可撤销。'))) return;
  await guard(async () => { const r = await post('/api/dorm/data/clear'); raw(r); toast('已清空'); await loadSummary(); });
}

// ── 一键分配 ────────────────────────────────────────────
function renderAssign() {
  $('panel-assign').innerHTML =
  card('一键分配', 'play_circle', `
    <p class="text-sm nx-muted mb-4">
      流程：硬约束校验 → 按「性别 × 楼栋类型(普通/特殊) × 专业大类 × 年级」分块 → 块内
      <strong>志愿簇预分组 → 最难的人优先贪心构造 → 局部搜索（含木桶守卫）→ 阻塞对修复</strong> → 全局违规复核 → 四维解释预生成。</p>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
      <label class="block md:col-span-2"><span class="text-xs nx-muted">批次名称</span>
        <input id="a-name" value="工作台分配" class="w-full rounded-md border-primary/20 bg-base-200 px-3 py-2"/></label>
      <label class="block"><span class="text-xs nx-muted">时间预算(ms)</span>
        <input id="a-budget" type="number" value="30000" class="w-full rounded-md border-primary/20 bg-base-200 px-3 py-2"/></label>
      <label class="block"><span class="text-xs nx-muted">随机种子</span>
        <input id="a-seed" type="number" value="20260927" class="w-full rounded-md border-primary/20 bg-base-200 px-3 py-2"/></label>
      <label class="block"><span class="text-xs nx-muted">志愿簇预分组</span>
        <select id="a-seed-pref" class="w-full rounded-md border-primary/20 bg-base-200 px-3 py-2"><option value="true">开</option><option value="false">关</option></select></label>
      <label class="block"><span class="text-xs nx-muted">阻塞对修复</span>
        <select id="a-repair" class="w-full rounded-md border-primary/20 bg-base-200 px-3 py-2"><option value="true">开</option><option value="false">关</option></select></label>
      <label class="block"><span class="text-xs nx-muted">局部搜索轮数</span>
        <input id="a-rounds" type="number" value="12" class="w-full rounded-md border-primary/20 bg-base-200 px-3 py-2"/></label>
      <label class="block"><span class="text-xs nx-muted">预生成解释(≤4000人)</span>
        <select id="a-explain" class="w-full rounded-md border-primary/20 bg-base-200 px-3 py-2"><option value="true">开</option><option value="false">关</option></select></label>
    </div>
    <button onclick="runAssign()" class="nx-btn nx-btn-primary nx-btn-lg">开始分配</button>
    <div id="assign-out" class="mt-5"></div>`) +
  card('历史批次', 'inventory_2', '<div id="batch-list">加载中…</div>');
  loadBatches();
}
async function runAssign() {
  const body = { name: $('a-name').value, withExplanations: $('a-explain').value === 'true',
    config: { seed: Number($('a-seed').value), timeBudgetMs: Number($('a-budget').value),
      localSearchRounds: Number($('a-rounds').value),
      enableBlockingPairRepair: $('a-repair').value === 'true' } };
  if ($('a-seed-pref').value === 'false') body.config.weights = { sum: 1.0, bucket: 0.0, preference: 0.0 };
  $('assign-out').innerHTML = '<div class="text-primary text-sm">分配中…（万人规模 30 秒预算内）</div>';
  await guard(async () => {
    const t0 = Date.now(); const r = await post('/api/dorm/assign', body); raw(r);
    CURRENT = r; await loadBatches();
    $('assign-out').innerHTML = metricsBlock(r) + `<div class="text-xs mt-2 nx-muted">端到端 ${Date.now()-t0} ms（含解释预生成与落库）</div>`;
    toast('批次 #' + r.batchId + ' 完成');
    await loadSummary();
  });
}
function metricsBlock(r) {
  const m = r.metrics || {}; const d = r.diagnostics || {};
  const warn = r.metricBasisWarning ? `<div class="mb-3 p-3 rounded-md bg-warning/10 text-warning text-sm">${esc(r.metricBasisWarning)}</div>` : '';
  const violations = m.hardViolations === 0
    ? '<span class="text-success font-bold">0 ✓</span>'
    : '<span class="text-error font-bold">' + m.hardViolations + ' ✗</span>';
  return warn + `
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
    ${statCard('硬约束违规', violations, '必须恒为 0', 'rule')}
    ${statCard('未分配人数', m.unassigned ?? 0, '应为 0', 'person_off')}
    ${statCard('均值相容度', num(m.meanCompat,4), '指标基准：'+(m.basis||'—'), 'trending_up')}
    ${statCard('最差那一对', num(m.worstCompat,4), '木桶效应', 'trending_down')}
    ${statCard('房内方差', num(m.meanRoomVariance,4), '越小越均匀', 'functions')}
    ${statCard('志愿满足率', pct(m.preferenceSatisfaction), '互相点名且同住', 'favorite')}
    ${statCard('阻塞对数', m.blockingPairs ?? 0, '互相想住却没同住', 'block')}
    ${statCard('运行耗时', (m.runtimeMs||0)+' ms', '求解器 '+esc(m.solver||''), 'timer')}
  </div>
  <details class="p-4 rounded-md bg-primary/5 text-sm">
    <summary class="font-bold cursor-pointer">诊断信息</summary>

        : '<span class="text-xs nx-muted">—</span>'}

      <b>NOT_FOUND_IN_SCOPE</b> 在我搜过的范围内没找到（<b>不等于无解</b>，搜索范围会一并给出）。

     <p class="text-sm nx-muted mb-4">

      → <b>跨块级</b>（把你的块和对方所在的块合并后整块重解，可能动几十到上千人）。
      前两级搜不到时点「跨块试算」：它在后台执行、<b>不改动任何分配</b>，只算出「要放宽哪条政策、要动多少人、目标函数变多少」供你判断。
      放宽政策不等于可以违反硬约束，试算结果会拿回原始配置再验一遍，违规的方案一律丢弃。</p>

      <thead><tr><th>id</th><th>学生</th><th>想同住</th><th>状态</th><th>搜索范围</th><th>代价/预算</th><th>耗时</th><th>结论</th><th>跨块</th><th>操作</th><th></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="11" class="nx-muted">这个批次还没有申诉。</td></tr>'}</tbody></table></div>`);
}
async function applyAppeal(id) {
  if (!(await nxConfirm('采纳这条申诉？将按建议的方案对调房间（不改动其他学生）。'))) return;
  await guard(async () => {
    const r = await post('/api/dorm/appeals/' + id + '/apply', { handledBy: 'admin' });
    raw(r); toast('已采纳：' + (r.moves||0) + ' 处调整');
    const t = document.querySelector('[data-tab=appeal]'); if (t) { await renderAppeal(); }
  });
}
async function crossTrial(appealId) {
  const id = CURRENT ? CURRENT.batchId : (BATCHES[0] && BATCHES[0].id);
  if (!id) { toast('先选一个批次', true); return; }
  if (!(await nxConfirm('跨块试算会把「你所在的块」和「对方所在的块」合并后整块重解，可能改动几十到上千人。\n\n试算本身不改动任何分配，只算出代价供你判断。\n\n提交？'))) return;
  await guard(async () => {
    const r = await post('/api/dorm/batches/' + id + '/appeals/' + appealId + '/cross', {});
    raw(r);
    const job = r.jobId;
    toast(r.reused ? '这条申诉已经在试算中，继续等待…' : '已提交跨块试算（后台执行）…');
    for (let i = 0; i < 240; i++) {
      await new Promise(s => setTimeout(s, 1500));
      const j = await api('/api/dorm/appeals/cross/' + job);
      if (j.state !== 'QUEUED' && j.state !== 'RUNNING') {
        raw(j);
        const res = j.result || {};
        if (j.state === 'DONE') {
          // 只有 SATISFIED 才有「代价」可言。失败路径后端把目标值/波及人数留成 0，
          // 直接把 0 打出来会被读成「改动为零」，而事实是「没找到方案」——两者差别很大。
          const ok = res.status === 'SATISFIED';
          await nxAlert('跨块试算完成：' + (res.status || '') +
            '\n\n' + (res.message || '') +
            '\n\n合并范围：' + (res.mergedStudents ?? '—') + ' 人 / ' + (res.mergedRooms ?? '—') + ' 间房' +
            (ok
              ? '\n本次要动：' + (res.moveCount ?? 0) + ' 人' +
                '\n目标函数：' + num(res.objectiveBefore, 2) + ' → ' + num(res.objectiveAfter, 2) +
                  '（' + num(res.objectiveDelta, 2) + '）'
              : '\n本次试算没有产出可采纳的调整方案，因此不报代价、也不报波及人数。') +
            '\n放宽政策：' + ((res.relaxations || []).map(x => x.label).join('、') || '无'));
        } else {
          toast('跨块试算未完成：' + j.state + '，' + (j.note || ''), true);
        }
        const t = document.querySelector('[data-tab=appeal]'); if (t) { await renderAppeal(); }
        return;
      }
    }
    toast('跨块试算仍在进行。点「详情」可看结论，或稍后刷新页面。', true);
  });
}
async function showAppeal(id) {

    <ul class="list-disc pl-5 text-sm nx-muted space-y-1">${reasons}</ul>`);

  html += card('哪几道题最缺', 'quiz', `
    <p class="text-sm nx-muted mb-4">按缺答人数排序。缺的人越多，「未知=中性」承担的不确定性越大。</p>
    <table class="grid-table"><thead><tr><th>题目</th><th>缺答人数</th></tr></thead><tbody>${cellRows}</tbody></table>`);

  html += card('问卷催填优先级（信息价值 Top-K）', 'priority_high', `
    <p class="text-sm nx-muted mb-4">对每个学生、每道他没答的题，估算「这一格补上后，他所在房间的期望相容度能提高多少」，按从高到低排。
      <strong>这是期望值不是保证</strong>：它回答「先问谁、问哪题」，不承诺补了名次就涨。<br>
      候选室友 ${pr.scored ?? 0} 人次评分 · ${(pr.evaluations ?? 0).toLocaleString()} 次评估${pr.truncated ? ' · <span class="text-warning">已截断（预算上限）</span>' : ''}</p>
    <div class="overflow-auto max-h-[65vh]"><table class="grid-table">
      <thead><tr><th>#</th><th>学生</th><th>学号</th><th>建议补采</th><th>期望增益 Δ</th><th>已知对照</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="6" class="nx-muted">没有可建议的格子（都答齐了，或者没人有已知对照）</td></tr>'}</tbody></table></div>
    <p class="text-xs nx-muted mt-4">${esc(pr.note || '')}</p>`);

  $('panel-collect').innerHTML = html;
  raw({ summary: s, priority: pr });
}

// ── 启动 ────────────────────────────────────────────────
guard(async () => {
  await loadBatches();
  await loadSummary();
  renderData();
});
